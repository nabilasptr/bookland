<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/style2.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>BookLand</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="#" class="logo">BookLand</a>

        <div class="nav-main">
          <!-- Kategori Button -->
          <a href="#" class="nav-link kategori">
            <i class="fa-solid fa-bars"></i> Kategori
          </a>

          <!-- Search Bar -->
          <div class="search-bar">
            <input type="text" placeholder="Search..." />
            <button><i class="fa-solid fa-search"></i></button>
          </div>
        </div>

        <div class="nav-icons">
          <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
          <a href="edit.html"><i class="fa-solid fa-pen-to-square"></i></a>
          <a href="notifications.html"><i class="fa-solid fa-bell"></i></a>
        </div>

        <div class="buttons">
          <a href="index.html" class="btn btn-login">Login</a>
          <a href="index.html" class="btn btn-signup">Signup</a>
        </div>
      </nav>
    </header>

    <center>
    <section class="textbook-marketplace">
      <div class="hero-section">
        <div class="hero-text">
          <p class="subheading">EDITOR CHOICE</p>
          <h1>
            <span class="underline">Top 10</span> Books<br />To Make It A Great
            Year
          </h1>
          <button class="shop-btn">Shop Now →</button>
        </div>
        <div class="hero-image">
          <img src="books.jpg" alt="Books" />
        </div>
        
      </div>
    </section>
    </center>
  </body>
</html>
